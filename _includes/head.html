<!-- Redirect GitHub Pages to Cloudflare Pages Safely -->
<script type="text/javascript">
  var host = window.location.hostname;
  var path = window.location.pathname;
  // Only redirect if the visitor is on github.io AND not fetching an asset folder
  if (host.includes("github.io") && !path.includes("/assets/")) {
    var newURL = window.location.href.replace("beautybookend.github.io/BB", "beautybookend.pages.dev");
    window.location.replace(newURL);
  }
</script>
